<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"> <!-- permite usar acentos -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- deixa responsivo -->
<title>Atividade 1</title> <!-- título da aba -->

<link rel="stylesheet" href="style.css"> <!-- conecta com o CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- importa Bootstrap -->

</head>

<body class="bg-light"> <!-- fundo claro -->

<main class="container mt-5"> <!-- área principal com margem no topo -->

<h1 class="text-center mb-4">👩‍💻 Desenvolvimento </h1> <!-- título centralizado -->

<div class="card p-4 shadow"> <!-- caixa com sombra -->

<!-- texto explicando o campo -->
<label for="nomeUsuario" class="form-label"> Digite seu nome completo: </label>

<!-- campo para digitar o nome -->
<input 
type="text" id="nomeUsuario" class="form-control" placeholder="Digite seu nome">

<br> <!-- espaço -->

<!-- botão para cadastrar -->
<button id="btnCadastrar" class="btn btn-outline-primary"> Cadastrar </button>

<!-- onde a mensagem vai aparecer -->
<p id="mensagem" class="fw-bold mt-3"></p>

</div>

</main>

<!-- conecta com o JavaScript -->
<script src="script.js"></script>

</body>
</html>
