<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8"> <!-- permite usar acentos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- deixa responsivo no celular -->
    <title>Atividade 3</title> <!-- título da aba -->

    <!-- importa o Bootstrap (estilo pronto) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light"> <!-- fundo claro -->

    <main class="container mt-5"> <!-- área principal com margem no topo -->

        <h1 class="text-center mb-4">Listar</h1> <!-- título centralizado -->

        <label for="valor" class="mb-4">Digite um texto:</label> <!-- texto do campo -->

        <!-- campo para digitar -->
        <input type="text" class="form-control" placeholder="Digite o texto" id="valor">

        <!-- botão para adicionar -->
        <button type="button" class="btn btn-outline-primary mt-3" id="btnTrocar"> Adicionar </button>

        <!-- lista onde os itens vão aparecer -->
        <ul id="listaTexto" class="mt-4"></ul>

    </main>

    <!-- conecta com o JavaScript -->
    <script src="script.js"></script>

</body>

</html>
