<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

    <main class="container mt-5">

        <h1 class="text-center mb-4">📋 Lista de Tarefas</h1>

        <div class="card">
            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">Tarefa do dia:</label>
                    <input type="text" id="inputTarefa" class="form-control" placeholder="Digite a tarefa">
                </div>

                <!-- Botão adicionar -->
                <button id="btnAdicionar" class="btn btn-outline-primary">
                    Adicionar
                </button>

                <hr>

                <ul id="listaTarefas" class="list-group mt-3">

                </ul>

            </div>
        </div>

    </main>

    <!-- Conecta no script.js -->
    <script src="script.js"></script>

</body>

</html>
